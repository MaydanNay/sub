services:
  shuschool-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - shuschool-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  shuschool-backend:
    build: ./backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@shuschool-db:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - OWNER_PASSWORD=${OWNER_PASSWORD}
      - OWNER_PHONE=${OWNER_PHONE}
      - DOMAIN=${DOMAIN}
      - IS_LOCAL=${IS_LOCAL:-0}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TELEGRAM_BOT_STUDENTS_PARENTS=${TELEGRAM_BOT_STUDENTS_PARENTS}
      - TELEGRAM_BOT_STAFF=${TELEGRAM_BOT_STAFF}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      shuschool-db:
        condition: service_healthy
    networks:
      - shuschool-net
    volumes:
      - ./backend/uploads:/app/uploads

  shuschool-bot:
    build: ./backend
    restart: always
    command: python telegram_bots.py
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@shuschool-db:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - DOMAIN=${DOMAIN}
      - TELEGRAM_BOT_STUDENTS_PARENTS=${TELEGRAM_BOT_STUDENTS_PARENTS}
      - TELEGRAM_BOT_STAFF=${TELEGRAM_BOT_STAFF}
    depends_on:
      shuschool-db:
        condition: service_healthy
    networks:
      - shuschool-net

  shuschool-frontend:
    build:
      context: .
      dockerfile: frontend-dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    restart: always
    depends_on:
      - shuschool-backend
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - shuschool-net

volumes:
  pgdata:

networks:
  shuschool-net:
    driver: bridge
