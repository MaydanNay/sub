server {
    listen 80;
    server_name school.shustudio.kz localhost;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://shuschool-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings for production
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --- SSL CONFIGURATION PREP ---
    # After running Certbot, you would typically have:
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/school.shustudio.kz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/school.shustudio.kz/privkey.pem;
}
